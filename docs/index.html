<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>CMP 发布</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="header-content"><a class="brand" href="./"><span class="logo" aria-hidden="true">C</span>CMP <span class="muted">/ 发布控制台</span></a></div></header>
<main>
  <div class="layout">
    <form id="config-form">
      <section aria-labelledby="sources-title">
        <div class="section-title"><h2 id="sources-title">源码分支</h2></div>
        <div class="branches" id="branches"></div>
      </section>
      <section aria-labelledby="toggle-dependencies">
        <h2 class="section-title dependency-heading">
          <button type="button" id="toggle-dependencies" aria-expanded="false" aria-controls="dependencies" aria-label="展开依赖">
            <span>依赖版本</span><span id="dependency-state" class="section-value"></span>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
          </button>
        </h2>
        <div class="toolbar" role="group" aria-label="设置所有依赖版本">
          <button type="button" id="reset-modes" aria-label="全部使用分支默认" aria-pressed="true">分支默认</button>
          <button type="button" id="latest-modes" aria-label="全部使用最新 release" aria-pressed="false">最新 release</button>
        </div>
        <div id="dependencies" hidden></div>
      </section>
      <section aria-labelledby="build-options-title">
        <div class="section-title"><h2 id="build-options-title">构建选项</h2></div>
        <div class="platform-options" role="group" aria-label="构建平台">
          <label><input type="checkbox" name="platform" value="android">Android</label>
          <label><input type="checkbox" name="platform" value="ohos" checked>OHOS</label>
          <label><input type="checkbox" name="platform" value="uikit">UIKit</label>
        </div>
        <label class="switch-row"><span>Debug 日志</span><input id="build-debug" type="checkbox" role="switch"></label>
        <label class="switch-row"><span>Trace</span><input id="build-trace" type="checkbox" role="switch"></label>
        <label class="switch-row" title="LTPO 日志需开启 Debug 日志；LTPO Trace 输出需开启 Trace"><span>LTPO</span><input id="build-ltpo" type="checkbox" role="switch"></label>
      </section>
      <section aria-labelledby="release-title">
        <div class="section-title"><h2 id="release-title">发布版本</h2><span id="full-version" class="section-value">1.12.0-…</span></div>
        <label class="field form-row"><span>版本后缀</span><input id="suffix" placeholder="以数字结尾，如 dev.01" autocomplete="off" maxlength="64" aria-describedby="suffix-message"></label>
        <p class="hint error" id="suffix-message" role="status" hidden></p>
        </section>
      <section aria-labelledby="repository-title">
        <div class="section-title"><h2 id="repository-title">发布仓库</h2></div>
        <label class="field form-row"><span>URL</span><input id="publish-url" type="url" maxlength="2048" spellcheck="false" autocomplete="off" placeholder="输入 Maven 仓库 HTTPS 地址" aria-describedby="repository-error"></label>
        <label class="field form-row"><span>用户名</span><input id="maven-username" maxlength="128" autocomplete="off" spellcheck="false" placeholder="Maven 用户名" aria-describedby="repository-error"></label>
        <label class="field form-row"><span>密码</span><input id="maven-password" type="password" maxlength="1024" autocomplete="off" placeholder="Maven 密码" aria-describedby="repository-error"></label>
        <p id="repository-error" class="hint error" role="status" hidden></p>
      </section>
    </form>
    <aside>
      <div class="summary-card">
        <h2>发布摘要</h2>
        <dl id="summary"></dl>
        <button type="button" id="publish-run" class="primary submit" aria-describedby="publish-status">开始发布</button>
        <p class="hint publish-status" id="publish-status" role="status"></p>
        <button type="button" id="debug-run" class="debug-button">Debug · Maven Local</button>
        <p id="debug-status" class="hint" role="status"></p>
      </div>
    </aside>
  </div>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
